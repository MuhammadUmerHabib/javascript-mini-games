<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess The Number</title>
    <link rel="stylesheet" href="../css/guess-number-game.css">
</head>
<body>
    
    <div class="container">
        <div class="box">
            <form action="" onsubmit="user_input(event)">
                <label for="user-Number" id="user-Number-label">Guess The Number</label>
                <input type="number" name="user-Number" id="user-Number" min="1" max="10" onfocus="input_focus()" onblur="input_blur()">
                <button type="submit">Guess</button>
            </form>
            <div class="result">
                <div class="output"><p>Computer Number: <span id="com_num">0</span></p></div>
                <div class="output"><p>Your Number: <span id="user_num">0</span></p></div>
            </div>
            <p id="message"></p>
        </div>
    </div>

    <script src="../js/guess-number-game.js"></script>
</body>
</html>
